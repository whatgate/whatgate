name: Release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# This cross-compiles all platforms and publishes a GitHub Release with the
# archives attached. Also runnable manually from the Actions tab (workflow_dispatch),
# which builds artifacts without publishing a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe` sees tags

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      # Guard: never ship binaries that don't pass the suite.
      - name: test
        run: go test ./... -timeout 120s

      - name: cross-compile
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && version="$(git describe --tags --always)"
          bash scripts/build-release.sh "$version"

      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whatgate-binaries
          path: dist/*

      # Only publish a Release for real tag pushes.
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "WhatGate ${GITHUB_REF_NAME}" \
            --generate-notes
